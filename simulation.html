/* ===================== sim additions (loader plumbing only) =====================
 * Nothing in this block touches packet parsing, hooks, constructors or queues.
 *   window.ARRAS_CONFIG        wasm file name, relay address
 *   window.turnstile           stand-in that asks captcha.js for a token your arras.io tab solves
 *   WebAssembly.instantiate    unchanged behaviour, but logs which imports the wasm needs
 * ============================================================================== */
(() => {
    const cfg = window.ARRAS_CONFIG = Object.assign({
        wasm: "./wasm/app.wasm",           // the wasm to run (served from ./wasm/)
        relay: "http://localhost:8080",    // captcha.js
        freshToken: true,                  // Turnstile tokens are single-use, ask for a new one per connection
        relayTimeoutMs: 170000
    }, window.ARRAS_CONFIG);

    // ---- small on-screen status line (relay / wasm problems) ------------------
    let badge, hideTimer;
    function status(text, kind, ms) {
        if (!badge) {
            badge = document.createElement("div");
            badge.style.cssText = "position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:2147483647;" +
                "padding:6px 12px;border-radius:6px;font:12px/1.35 Ubuntu,sans-serif;color:#fff;" +
                "pointer-events:none;max-width:90vw;text-align:center";
            document.body.appendChild(badge);
        }
        clearTimeout(hideTimer);
        badge.textContent = text;
        badge.style.background = kind === "err" ? "#b3261e" : kind === "ok" ? "#2e7d32" : "#37474f";
        badge.style.display = text ? "block" : "none";
        if (ms) hideTimer = setTimeout(() => { badge.style.display = "none"; }, ms);
    }
    window.__simStatus = status;

    // ---- Turnstile stand-in ---------------------------------------------------
    // Cloudflare's widget won't run off arras.io (the sitekey is bound to that domain), so
    // render() asks the local relay for a token that the userscript solves in a real arras.io tab.
    const widgets = new Map();
    let widgetCounter = 0;
    const pick = target => widgets.has(target) ? target : [...widgets.keys()].pop();
    const call = (fn, ...args) => {
        try { (typeof fn === "string" ? window[fn] : fn)?.(...args); }
        catch (e) { console.error("[turnstile relay] callback threw", e); }
    };

    async function fetchToken(siteKey) {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), cfg.relayTimeoutMs);
        try {
            const res = await fetch(`${cfg.relay}/${siteKey}${cfg.freshToken ? "?fresh=1" : ""}`, { signal: ctrl.signal });
            if (!res.ok) throw new Error(`relay answered HTTP ${res.status}`);
            const token = (await res.text()).trim();
            if (!token) throw new Error("relay returned an empty token");
            return token;
        } catch (e) {
            if (e.name === "AbortError") throw new Error("timed out waiting for your arras.io tab");
            if (e instanceof TypeError) throw new Error(`can't reach the relay at ${cfg.relay} (is "node captcha" running?)`);
            throw e;
        } finally {
            clearTimeout(timer);
        }
    }

    async function solve(id) {
        const w = widgets.get(id);
        if (!w || w.busy) return;
        w.busy = true;
        w.token = undefined;
        clearTimeout(w.expiry);
        status("Turnstile: waiting for a token from your arras.io tab…");
        try {
            const token = await fetchToken(w.opts.sitekey);
            if (widgets.get(id) !== w) return;               // removed while waiting
            w.token = token;
            status("Turnstile: token received", "ok", 2500);
            w.expiry = setTimeout(() => { w.token = undefined; call(w.opts["expired-callback"]); }, 290000);
            call(w.opts.callback, token);
        } catch (e) {
            console.error("[turnstile relay]", e);
            if (widgets.get(id) === w) {
                status("Turnstile relay: " + e.message, "err");
                call(w.opts["error-callback"], "relay-failed");
            }
        } finally {
            w.busy = false;
        }
    }

    const turnstileShim = {
        render(container, opts = {}) {
            const id = `relay-widget-${widgetCounter++}`;
            widgets.set(id, { opts, busy: false });
            if (opts.execution !== "execute") queueMicrotask(() => solve(id));
            return id;
        },
        execute(target) { const id = pick(target); if (id) solve(id); },
        reset(target) {
            const id = pick(target), w = widgets.get(id);
            if (!w) return;
            clearTimeout(w.expiry);
            w.token = undefined;
            if (w.opts.execution !== "execute") solve(id);
        },
        remove(target) {
            const id = pick(target), w = widgets.get(id);
            if (w) { clearTimeout(w.expiry); widgets.delete(id); }
        },
        getResponse(target) { return widgets.get(pick(target))?.token; },
        isExpired(target) { return !widgets.get(pick(target))?.token; },
        ready(cb) { Promise.resolve().then(cb); }
    };
    // Cloudflare's api.js (if it ever loads) assigns window.turnstile; ignore that so the stand-in stays.
    Object.defineProperty(window, "turnstile", { get: () => turnstileShim, set() { }, configurable: true, enumerable: true });

    // Don't fetch Cloudflare's script at all; just tell whoever appended it that it "loaded".
    const TURNSTILE_SRC = /^https:\/\/challenges\.cloudflare\.com\/turnstile\//;
    for (const parent of [document.head, document.body]) {
        const original = parent.appendChild;
        parent.appendChild = function (child) {
            if (child instanceof HTMLScriptElement && TURNSTILE_SRC.test(child.src)) {
                setTimeout(() => child.dispatchEvent(new Event("load")), 0);
                return child;
            }
            return original.call(this, child);
        };
    }

    // ---- WebAssembly import check ---------------------------------------------
    // The loader's import table is positional, so a different wasm build needs a matching table.
    // Behaviour is unchanged; this only reports a mismatch instead of failing silently.
    const nativeInstantiate = WebAssembly.instantiate.bind(WebAssembly);

    function checkImports(module, imports) {
        let need;
        try { need = WebAssembly.Module.imports(module).filter(i => i.kind === "function"); } catch { return; }
        const have = Object.values(imports).reduce((n, group) => n + Object.keys(group ?? {}).length, 0);
        const wanted = new Set(need.map(i => i.module + "." + i.name)).size;   // some imports are listed more than once
        const missing = need.filter(i => typeof imports?.[i.module]?.[i.name] !== "function");
        console.info(`[sim] wasm imports ${wanted} distinct functions, this loader defines ${have}`);
        if (missing.length) {
            const names = missing.slice(0, 6).map(i => `${i.module}.${i.name}`).join(", ");
            const msg = `wasm needs ${missing.length} import(s) this loader doesn't define (${names}${missing.length > 6 ? ", …" : ""}). ` +
                        `The import table in simulation.html is for a different build.`;
            console.error("[sim]", msg, missing);
            status(msg, "err");
        } else if (have > wanted) {
            console.warn(`[sim] loader defines ${have - wanted} more imports than this wasm uses: the packet hooks ` +
                         `(decrypted-byte, packet_queue, modifier) stay idle because this wasm has no call sites for them (stock build).`);
        }
    }

    WebAssembly.instantiate = async function (source, imports) {
        if (source instanceof WebAssembly.Module) return nativeInstantiate(source, imports);
        const module = await WebAssembly.compile(source);
        if (Array.isArray(imports)) checkImports(module, imports);    // arras loader passes an array
        const instance = await nativeInstantiate(module, imports);
        return { module, instance };
    };
    WebAssembly.instantiateStreaming = async function (response, imports) {
        const bytes = await (await response).arrayBuffer();
        return WebAssembly.instantiate(bytes, imports);
    };
})();

                    return offset;
                }

                parse_team_minimap_deletions(packet, offset) {
                    let len = packet[offset++];
                    for (let iter = 0; iter < len; iter++) {
                        delete this.team_minimap[packet[offset++]];
                    }
                    return offset;
                }

                parse_leaderboard(packet, offset, offsets, encoded_packet) {
                    let len = packet[offset++];
                    for (let iter = 0; iter < len; iter++) {
                        let id = packet[offset++];
                        let entry = {
                            score: packet[offset++],
                            mockup_index: packet[offset++]
                        };
                        let name_len = encoded_packet[offsets[offset++]] - 192;
                        let name_offset = offsets[offset];
                        let bytes = 0;
                        let name = "";
                        while (bytes !== name_len) {
                            let byte = encoded_packet[name_offset];
                            let length;
                            if (byte < 128) {
                                length = 1;
                            } else if (byte >= 192 && byte <= 223) {
                                length = 2;
                            } else if (byte >= 224 && byte <= 239) {
                                length = 3;
                            } else {
                                length = 4;
                            };
                            name += this.decoder.decode(encoded_packet.slice(name_offset, name_offset + length));
                            bytes += length;
                            name_offset += length;
                            offset += length == 1 ? 1 : 2;
                        };
                        entry.name = name;
                        entry.color = packet[offset++];
                        entry.bar_color = packet[offset++];
                        this.leaderboard[id] = entry;
                    }
                    return offset;
                }

                parse_leaderboard_deletions(packet, offset) {
                    let len = packet[offset++];
                    for (let iter = 0; iter < len; iter++) {
                        delete this.leaderboard[packet[offset++]];
                    }
                    return offset;
                }
            }

            class mockup_parser {
                constructor() {
                    this.mockups = {};
                    this.mockups_name_id_map = {};
                    this.decoder = new TextDecoder();
                    this.debug_dumped = false; // Prevent console flooding
                }

                parse(packet) {
                    let offset = 2;
                    while (offset < packet.length) {
                        // Scan for the next valid Mockup ID
                        if (packet[offset + 1] !== 0 && packet[offset] > 0 && packet[offset] == Math.trunc(packet[offset]) && packet[offset + 1] == Math.trunc(packet[offset + 1])) {
                            let id = packet[offset];
                            let name_len = packet[offset + 1];
                            if (name_len < 0) name_len = 32 + name_len;

                            let potential_name_bytes = packet.slice(offset + 2, offset + 2 + name_len);
                            if (!potential_name_bytes.some(byte => byte > 255)) {
                                let potential_name = this.decoder.decode(new Uint8Array(potential_name_bytes));
                                let cleaned_name = potential_name.split("/")[0].trim();

                                if (!/[\p{C}\uFFFD]/u.test(cleaned_name) && cleaned_name.length > 0) {

                                    // Start parsing the DNA based on our sniffer discoveries
                                    let data_offset = offset + 2 + name_len;

                                    let unknown = packet[data_offset++];
                                    let size = packet[data_offset++];
                                    let shape = packet[data_offset++];
                                    if (shape == 2048) shape = 0; else if (shape > 1024) shape -= 1024;
                                    let color = packet[data_offset++];
                                    let tier = packet[data_offset++];
                                    let speed = packet[data_offset++];
                                    let friction = packet[data_offset++];

                                    // Upgrades
                                    let upgrades_count = packet[data_offset++];
                                    let upgrades = [];
                                    for (let i = 0; i < upgrades_count; i++) {
                                        upgrades.push({
                                            tier: packet[data_offset++],
                                            id: packet[data_offset++]
                                        });
                                    }

                                    // Guns
                                    let guns_count = packet[data_offset++];
                                    let guns = [];
                                    for (let i = 0; i < guns_count; i++) {
                                        guns.push({
                                            angle: packet[data_offset++],
                                            delay: packet[data_offset++],
                                            length: packet[data_offset++],
                                            width: packet[data_offset++],
                                            aspect: packet[data_offset++],
                                            x_offset: packet[data_offset++],
                                            y_offset: packet[data_offset++]
                                        });
                                    }

                                    // Save the full blueprint
                                    this.mockups[id] = {
                                        name: cleaned_name,
                                        shape: shape,
                                        size: size,
                                        color: color,
                                        tier: tier,
                                        speed: speed,
                                        friction: friction,
                                        upgrades: upgrades,
                                        guns: guns
                                    };
                                    this.mockups_name_id_map[cleaned_name] = id;
                                }
                            }
                        }
                        offset++;
                    }
                }
            }

            class player_tab_parser {
                constructor() {
                    this.players = {};
                    this.decoder = new TextDecoder();
                }

                parse(packet, offsets, encoded_packet) {
                    let deletions_len = packet[1];
                    for (let deletion = 0; deletion < deletions_len; deletion += 1) delete this.players[packet[2 + deletion]];
                    let offset = 2 + deletions_len;
                    let additions_len = packet[offset++];
                    for (let addition = 0; addition < additions_len; addition += 1) {
                        let id = packet[offset++];
                        let tier = packet[offset++];
                        let name_len = encoded_packet[offsets[offset++]] - 192;
                        let name_offset = offsets[offset];
                        let bytes = 0;
                        let name = "";
                        while (bytes !== name_len) {
                            let byte = encoded_packet[name_offset];
                            let length;
                            if (byte < 128) {
                                length = 1;
                            } else if (byte >= 192 && byte <= 223) {
                                length = 2;
                            } else if (byte >= 224 && byte <= 239) {
                                length = 3;
                            } else {
                                length = 4;
                            };
                            name += this.decoder.decode(encoded_packet.slice(name_offset, name_offset + length));
                            bytes += length;
                            name_offset += length;
                            offset += length == 1 ? 1 : 2;
                        };
                        this.players[id] = {
                            tier: tier,
                            name: name,
                            mockup_index: packet[offset++]
                        };
                    }
                }
            }

            class room_parser {
                constructor() {
                    this.room_dimensions = [];
                    this.grid = [];
                }

                parse(packet, game_data) {
                    let split_game_data = game_data.split(",");
                    for (let entry in split_game_data) {
                        let current_data = split_game_data[entry].split("=");
                        this[current_data[0]] = current_data[1];
                    };
                    this.room_dimensions = [packet[0], packet[1], packet[2], packet[3]];
                    // Unsure of what either of these values are, usually just 1 and 45
                    let idk_1 = packet[4];
                    let idk_2 = packet[5];
                    let grid_width = packet[6];
                    let grid_height = packet[7];
                    this.grid = Array.from({ length: grid_height }, () => Array.from({ length: grid_width }, () => 0));
                    let grid_data = packet.slice(8, packet.length);
                    let iter = 0;
                    for (let y = 0; y < grid_height; y++) {
                        for (let x = 0; x < grid_width; x++) {
                            this.grid[y][x] = grid_data[iter];
                            iter++;
                        }
                    }
                }
            }

            function yield_control_comps_from_angle(angle) {
                let cartesian_x_comp = -Math.cos(angle);
                let cartesian_y_comp = Math.sin(angle);
                let x_comp = Math.floor(Math.abs(cartesian_x_comp) * 64);
                let y_comp = Math.floor(Math.abs(cartesian_y_comp) * 64);
                if (cartesian_x_comp < 0) x_comp = 191 - x_comp;
                if (cartesian_y_comp > 0) y_comp = 191 - y_comp;
                return [x_comp, y_comp];
            };

            function encode_arras_number(n) {
                if (n >= 0 && n <= 127) return [n];
                if (n >= -64 && n <= -1) return [n & 0xFF];
                if (Math.abs(n) < 2048) return [0b11100000 | (n >> 8 & 0x0F), n & 0xFF];
                if (Math.abs(n) < 524288) return [0b11110000 | (n >> 16 & 0x07), (n >> 8) & 0xFF, n & 0xFF];
                return [0b11111000 | (n >> 24 & 0x03), (n >> 16) & 0xFF, (n >> 8) & 0xFF, n & 0xFF];
            }

            window.packet_constructors = {
                construct_message_packet: function construct_message_packet(message) {
                    let packet;
                    let encoded_message = new TextEncoder().encode(message);
                    if (message.length < 32) {
                        packet = new Uint8Array(message.length + 2);
                        packet[1] = message.length + 192;
                        packet.set(encoded_message, 2);
                    } else {
                        packet = new Uint8Array(message.length + 4);
                        packet[1] = 254;
                        packet[2] = message.length;
                        packet[3] = 0;
                        packet.set(encoded_message, 4);
                    }
                    packet[0] = 77;
                    return packet;
                },
                construct_spawn_packet: function construct_spawn_packet(name, party) {
                    let encoded_name = new TextEncoder().encode(name);
                    let encoded_party = new TextEncoder().encode(party);
                    let packet = new Uint8Array(encoded_name.byteLength + encoded_party.byteLength + 4);
                    packet[1] = 192 + encoded_name.byteLength;
                    packet.set(encoded_name, 2);
                    packet[2 + encoded_name.length] = 192 + encoded_party.byteLength;
                    packet.set(encoded_party, 3 + encoded_name.length);
                    packet[packet.byteLength - 1] = 1;
                    packet[0] = 115;
                    return packet;
                },
                construct_tank_upgrade_packet: function construct_tank_upgrade_packet(upgrade) {
                    return new Uint8Array([85, upgrade]);
                },
                construct_stat_upgrade_packet: function construct_stat_upgrade_packet(stat, len) {
                    return new Uint8Array([120, stat, len]);
                },
                construct_command_packet: function construct_command_packet(action) {
                    return new Uint8Array([116, action]);
                },
                construct_self_destruct_packet: function construct_self_destruct_packet() {
                    return new Uint8Array([75]);
                },
                construct_ability_packet: function construct_ability_packet() {
                    return new Uint8Array([65]);
                },
                construct_pause_score_packet: function construct_pause_score_packet() {
                    return new Uint8Array([68]);
                },
                construct_control_packet: function construct_control_packet(x_comp, y_comp, direction) {
                    return new Uint8Array([67, x_comp, y_comp, direction]);
                },
                construct_kick_packet: function construct_kick_packet(id) {
                    const bytes = encode_arras_number(id);
                    const packet = new Uint8Array(2 + bytes.length);
                    packet[0] = 80;
                    packet[1] = 2; // Kick
                    packet.set(bytes, 2);
                    return packet;
                },
                construct_promote_packet: function construct_promote_packet(id) {
                    const bytes = encode_arras_number(id);
                    const packet = new Uint8Array(2 + bytes.length);
                    packet[0] = 80;
                    packet[1] = 0; // Promote
                    packet.set(bytes, 2);
                    return packet;
                },
                construct_demote_packet: function construct_demote_packet(id) {
                    const bytes = encode_arras_number(id);
                    const packet = new Uint8Array(2 + bytes.length);
                    packet[0] = 80;
                    packet[1] = 1; // Demote
                    packet.set(bytes, 2);
                    return packet;
                },
                construct_admin_login_packet: function construct_admin_login_packet(password) {
                    let encoded_pw = new TextEncoder().encode(password);
                    let packet = new Uint8Array(encoded_pw.byteLength + 2);
                    packet[0] = 76;
                    packet[1] = 192 + encoded_pw.byteLength;
                    packet.set(encoded_pw, 2);
                    return packet;
                }
            };

            window.packet_queue = [];

            window.terminate = function () {
                window.socket.close();
                window.close();
            };

            // Export all parsers to global scope so they can be run in the dev console
            window.update_parser = update_parser;
